<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Day</title>
<!-- Game Day: single-file static page. Source of truth: GitLab arvideo/gameday, branch prototype/builder-v1. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root { --ground:#e4e9ea; --panel:#ffffff; --ink:#132021; --mute:#5b6b6c; --line:#c9d2d3; --accent:#0b6b74; --accent-ink:#ffffff; --go:#1f9d4c; --soft:#f1f4f4; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground:#0e1516; --panel:#172123; --ink:#e7eeee; --mute:#93a4a5; --line:#2a383a; --accent:#3fb6c1; --accent-ink:#06282b; --go:#34c759; --soft:#1e2a2c; } }
  :root[data-theme="dark"] { --ground:#0e1516; --panel:#172123; --ink:#e7eeee; --mute:#93a4a5; --line:#2a383a; --accent:#3fb6c1; --accent-ink:#06282b; --go:#34c759; --soft:#1e2a2c; }

  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font:400 15px/1.45 Inter, system-ui, sans-serif; padding-inline:16px; padding-block:18px 110px; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .wrap { max-width:1180px; margin:0 auto; }
  .top { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; margin-bottom:16px; }
  .top h1 { font:400 30px/1 Anton, Impact, sans-serif; text-transform:uppercase; letter-spacing:.02em; margin:0; }
  .top p { margin:0; color:var(--mute); font-size:13px; }
  .eyebrow { font:700 12px/1 'Barlow Condensed', sans-serif; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); margin:0 0 8px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .stack { display:flex; flex-direction:column; gap:14px; }

  /* chiclets (the builder's toggles) */
  .chips { display:grid; grid-template-columns:repeat(auto-fill, minmax(132px, 1fr)); gap:8px; }
  .chip { text-align:left; background:var(--soft); border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:2px; min-height:58px; }
  .chip b { font:800 17px/1 'Barlow Condensed', sans-serif; letter-spacing:.06em; text-transform:uppercase; display:flex; align-items:center; gap:7px; }
  .chip b::before { content:''; width:14px; height:14px; border-radius:4px; border:1.5px solid var(--mute); flex-shrink:0; }
  .chip small { color:var(--mute); font-size:11.5px; line-height:1.25; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .chip[aria-pressed="true"] small { color:inherit; opacity:.8; }
  .chip[aria-pressed="true"] b::before { background:var(--accent-ink); border-color:var(--accent-ink); }
  .chip[disabled] { opacity:.75; cursor:default; }

  .seg { display:inline-flex; background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px; }
  .seg button { border:0; background:transparent; border-radius:8px; padding:7px 14px; font:700 15px/1 'Barlow Condensed', sans-serif; letter-spacing:.08em; text-transform:uppercase; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }

  /* fields */
  .grp { border-top:1px solid var(--line); padding-top:12px; }
  .grp:first-child { border-top:0; padding-top:0; }
  .grp-h { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .grp-h h3 { margin:0; font:800 18px/1 'Barlow Condensed', sans-serif; letter-spacing:.08em; text-transform:uppercase; }
  .mv { display:flex; gap:4px; }
  .mv button, .icon { border:1px solid var(--line); background:var(--soft); border-radius:8px; width:32px; height:30px; line-height:1; }
  .flds { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
  .fld { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .fld.wide { grid-column:1 / -1; }
  .fld span { font-size:12px; color:var(--mute); }
  input[type=text], input[type=url], textarea, select { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; }
  input[type=color] { width:100%; height:36px; border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:2px; }
  .rows { display:flex; flex-direction:column; gap:6px; grid-column:1 / -1; }
  .row { display:flex; gap:6px; align-items:center; }
  .row input[type=text] { flex:1; }
  .row input.e { flex:0 0 52px; text-align:center; }
  .row .hot { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--mute); white-space:nowrap; min-height:40px; padding:0 4px; cursor:pointer; }
  input[type=checkbox], input[type=radio] { width:20px; height:20px; accent-color:var(--accent); }
  .add { align-self:flex-start; border:1px dashed var(--line); background:transparent; border-radius:8px; padding:6px 12px; color:var(--mute); }
  .hint { color:var(--mute); font-size:12.5px; margin:0; grid-column:1 / -1; }

  .btn { border:0; border-radius:10px; padding:12px 16px; font:800 17px/1 'Barlow Condensed', sans-serif; letter-spacing:.1em; text-transform:uppercase; background:var(--go); color:#fff; }
  .btn.alt { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line); }
  .send { display:flex; flex-direction:column; gap:10px; }
  .send .btns { display:flex; flex-wrap:wrap; gap:8px; }
  .send .btns .btn { flex:1 1 150px; }
  .email-pv { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 12px 16px; max-width:444px; margin:0 auto; color:#222; }
  .pvlab { font:700 12px/1 'Barlow Condensed', sans-serif; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin:0 0 10px 4px; }
  .email-pv .mail { box-shadow:none; border-radius:22px 22px 0 0; margin-bottom:0; padding-bottom:0; }
  .email-pv > table { margin:0 auto; }
  .endmark { display:flex; align-items:center; gap:10px; color:var(--mute); font:700 11px/1 'Barlow Condensed', sans-serif; letter-spacing:.2em; text-transform:uppercase; margin:6px 0 -4px; }
  .endmark::before, .endmark::after { content:''; flex:1; border-top:1px dashed var(--line); }
  .sendp { border:2px solid var(--accent); }
  .steps { list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:10px; counter-reset:s; }
  .steps li { display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--soft); border-radius:10px; counter-increment:s; }
  .steps li::before { content:counter(s); flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font:800 15px/28px 'Barlow Condensed', sans-serif; text-align:center; }
  .steps li > div { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .steps li b { font-size:14.5px; }
  .steps li span { color:var(--mute); font-size:12.5px; }
  .steps li .btn { flex-shrink:0; }
  @media (max-width:520px) { .steps li { flex-wrap:wrap; } .steps li .btn { width:100%; margin-left:40px; } }
  .remind { display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:13px; color:var(--mute); }
  .remind select { width:auto; padding:5px 8px; }
  details.dump summary { cursor:pointer; color:var(--mute); font-size:12.5px; }
  details.dump pre { max-height:260px; overflow:auto; font-size:11.5px; background:var(--soft); border-radius:8px; padding:10px; margin:8px 0 0; }

  /* A: workbench */
  .wb { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:24px; align-items:start; }
  .wb .pvcol { position:sticky; top:calc(env(safe-area-inset-top, 0px) + 12px); max-height:calc(100vh - 24px); overflow:auto; overscroll-behavior:contain; border-radius:16px; }
  .wb .pvcol .email-pv { max-width:none; }
  .pvcol [data-blk] { cursor:pointer; }
  [data-blk].glow, [data-grp].glow { animation:glow 900ms ease-out; }
  @keyframes glow { from { box-shadow:0 0 0 3px #ffd23f, 0 0 18px 4px rgba(255,210,63,.6); } to { box-shadow:0 0 0 3px rgba(255,210,63,0), 0 0 18px 4px rgba(255,210,63,0); } }
  @media (prefers-reduced-motion: reduce) { [data-blk].glow, [data-grp].glow { animation:none; } }
  .tabs { display:none; margin-bottom:12px; }
  @media (max-width: 899px) {
    .wb { grid-template-columns:minmax(0,1fr); }
    .wb .pvcol { position:static; max-height:none; overflow:visible; }
    .tabs { display:inline-flex; }
    .wb[data-tab="build"] .pvcol { display:none; }
    .wb[data-tab="preview"] .edcol { display:none; }
  }

  /* B: tap the email */
  .tap { max-width:440px; margin:0 auto; }
  .blk { position:relative; cursor:pointer; }
  .hnd { position:absolute; z-index:5; top:8px; right:8px; display:flex; gap:3px; background:rgba(10,14,15,.82); border-radius:9px; padding:3px; }
  .blk[data-id="event"] > .hnd { top:74px; }
  .hnd button { border:0; background:transparent; color:#fff; min-width:30px; height:28px; border-radius:6px; font:700 13px/1 'Barlow Condensed', sans-serif; letter-spacing:.08em; text-transform:uppercase; }
  .hnd button:hover { background:rgba(255,255,255,.18); }
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40; }
  .sheet { position:fixed; z-index:41; left:0; right:0; bottom:0; max-height:62%; overflow:auto; background:var(--panel); border-radius:18px 18px 0 0; padding:16px 16px calc(90px + env(safe-area-inset-bottom, 0px)); box-shadow:0 -10px 40px rgba(0,0,0,.3); }
  .sheet > div { max-width:560px; margin:0 auto; }

  /* C: interview */
  .iv { max-width:620px; margin:0 auto; }
  .dots { display:flex; gap:5px; margin-bottom:14px; }
  .dots i { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .dots i.on { background:var(--accent); }
  .iv h2 { font:400 30px/1.05 Anton, Impact, sans-serif; text-transform:uppercase; margin:0 0 4px; text-wrap:balance; }
  .iv .lede { color:var(--mute); margin:0 0 14px; }
  .nav { display:flex; justify-content:space-between; gap:8px; margin-top:16px; }
  .sports { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:10px; }
  .sport { text-align:left; background:var(--soft); border:1.5px solid var(--line); border-radius:12px; padding:14px; }
  .sport b { display:block; font:400 24px/1 Anton, Impact, sans-serif; text-transform:uppercase; }
  .sport small { color:var(--mute); }
  .sport[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent); }
  .mini { max-width:420px; margin:16px auto 0; }

  /* home / season / event */
  .season { max-width:560px; margin:0 auto; }
  .steps-page .mini { zoom:.6; width:420px; max-width:none; margin:0; align-self:center; flex-shrink:0; }
  .steps-page .mini .mail { width:420px; max-width:none; }
  @media (max-width: 899px), (pointer: coarse) {
    .btn, .add, .seg button, select, input[type=text], input[type=url], .chip { min-height:40px; }
    .icon, .mv button, .hnd button { min-width:40px; min-height:40px; }
    .remind select { min-height:40px; }
  }
  .stepnav { position:sticky; bottom:0; z-index:20; display:flex; gap:10px; padding:12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background:var(--ground); box-shadow:0 -8px 12px -8px rgba(0,0,0,.18); }
  .stepnav .btn { flex:1; padding:16px; font-size:19px; }
  .stepnav .btn[disabled] { opacity:.35; }
  .steps-page input[type=text], .steps-page input[type=url], .steps-page textarea, .steps-page select { font-size:16px; padding:11px 12px; }
  details.more summary { cursor:pointer; color:var(--mute); font-size:13.5px; margin-top:12px; }
  .status { font:800 13px/1 'Barlow Condensed', sans-serif; letter-spacing:.14em; text-transform:uppercase; padding:7px 10px; border-radius:8px; background:var(--soft); color:var(--mute); border:1px solid var(--line); }
  .status.sent { background:var(--go); color:#fff; border-color:var(--go); }
  .sport, .sport b, .sport small, .ttl, .ts b, .ts span, .wk-list .wk > *, .panel .eyebrow, .grp-h h3, .title, .banner .org, .banner .what, .vs span, .big, .nm, .ct { overflow-wrap:anywhere; min-width:0; }
  .ttl { font:800 20px/1 'Barlow Condensed', sans-serif; letter-spacing:.06em; text-transform:uppercase; }
  .ts-list { display:flex; flex-direction:column; gap:8px; }
  .ts { display:flex; align-items:center; gap:14px; text-align:left; background:var(--soft); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; }
  .ts .swatch { flex-shrink:0; width:14px; align-self:stretch; border-radius:4px; background:var(--c); }
  .ts div { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
  .ts b { font:400 22px/1 Anton, Impact, sans-serif; text-transform:uppercase; letter-spacing:.02em; }
  .ts span { font-size:13px; }
  .ts .mu { color:var(--mute); }
  .ts .arrow { font-size:28px; color:var(--mute); line-height:1; }
  .ts-row { position:relative; display:flex; }
  .ts-row .ts { flex:1; min-width:0; padding-right:46px; }
  .ts-row .x { position:absolute; top:2px; right:2px; width:40px; height:40px; border:0; background:transparent; border-radius:8px; color:var(--mute); font-size:17px; line-height:1; }
  .ts-row .x:hover { background:var(--line); color:var(--ink); }
  .wk-edit .row input[type=text] { flex:1; min-width:0; }
  .wk-list { display:flex; flex-direction:column; gap:6px; }
  .wk-list .wk { display:grid; grid-template-columns:52px 72px 1fr 1fr 70px; gap:8px; align-items:center; text-align:left; background:var(--soft); border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13.5px; }
  .wk-list .wk b { font:800 16px/1 'Barlow Condensed', sans-serif; letter-spacing:.06em; text-transform:uppercase; }
  .wk-list .wk .st { font:700 11px/1 'Barlow Condensed', sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
  .wk-list .wk .mu { color:var(--mute); text-align:right; }
  .wk-list .wk.on { border-color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent); }
  .wk-list .wk.on .st { color:var(--accent); }
  @media (max-width:520px) { .wk-list .wk { grid-template-columns:44px 1fr 1fr; } .wk-list .wk .mu, .wk-list .wk > span:nth-child(3) { display:none; } }


  /* result overlay */
  .ov { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.72); display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:20px 16px 100px; }
  .ov .box { background:var(--panel); border-radius:16px; padding:16px; max-width:460px; width:100%; }
  .ov img { width:100%; border-radius:8px; border:1px solid var(--line); display:block; margin-top:10px; }
  .ov textarea { margin-top:10px; min-height:180px; font-size:13px; }
  #shot { position:fixed; left:-10000px; top:0; width:420px; }

  /* ================= the email (look borrowed from flag-emails/mock.html; single look, not themed) ================= */
  .mail { --gut:12px; width:100%; max-width:420px; margin:0 auto; background:var(--deep); border-radius:22px; overflow:hidden; box-shadow:0 18px 40px rgba(0,0,0,.28); padding-bottom:var(--gut); color:#fff; font-family:Inter, system-ui, sans-serif; line-height:1.3; }
  .mail.flat { border-radius:0; box-shadow:none; width:420px; }
  .banner { display:flex; align-items:center; gap:12px; background:#fff; padding:12px 18px; }
  .badge { flex-shrink:0; width:44px; height:44px; border-radius:50%; background:var(--primary); color:#fff; font:26px/44px Anton, Impact, sans-serif; text-align:center; text-transform:uppercase; }
  .banner .org { font:800 12px/1 'Barlow Condensed', sans-serif; letter-spacing:.2em; text-transform:uppercase; color:var(--primary); }
  .banner .what { font:30px/1 Anton, Impact, sans-serif; text-transform:uppercase; color:#111; margin-top:4px; }
  .hero { position:relative; overflow:hidden; background:linear-gradient(170deg, var(--primary) 0%, var(--primary) 55%, var(--deep) 100%); padding:26px 22px 22px; }
  .hero::before, .hero::after { content:''; position:absolute; inset:0; pointer-events:none; }
  .hero::before { background:repeating-linear-gradient(155deg, rgba(255,255,255,.055) 0 9px, transparent 9px 24px); clip-path:polygon(0 0, 50% 0, 50% 100%, 0 100%); }
  .hero::after  { background:repeating-linear-gradient(25deg,  rgba(255,255,255,.055) 0 9px, transparent 9px 24px); clip-path:polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }
  .ghost { position:absolute; right:-14px; top:-38px; font:280px/1 Anton, Impact, sans-serif; color:transparent; -webkit-text-stroke:2px rgba(255,255,255,.14); z-index:0; }
  .hero > :not(.ghost) { position:relative; z-index:1; }
  .kick { font:700 13px/1.2 'Barlow Condensed', sans-serif; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); }
  .title { font:58px/.92 Anton, Impact, sans-serif; text-transform:uppercase; margin:10px 0 0; overflow-wrap:anywhere; }
  .title .wk { color:var(--accent); }
  .sub { font:800 25px/1 'Barlow Condensed', sans-serif; letter-spacing:.12em; text-transform:uppercase; margin-top:6px; opacity:.92; }
  .vs { display:inline-block; margin-top:16px; background:#fff; color:var(--primary); font:32px/1 Anton, Impact, sans-serif; text-transform:uppercase; padding:8px 16px 9px; transform:skewX(-10deg); box-shadow:5px 5px 0 var(--accent); }
  .vs span { display:inline-block; transform:skewX(10deg); }
  .vs small { font:800 19px/1 'Barlow Condensed', sans-serif; letter-spacing:.06em; margin-right:6px; opacity:.75; }
  .times { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-top:18px; }
  .pill { border:1.5px solid rgba(255,255,255,.35); border-radius:10px; padding:8px 10px; }
  .pill b { display:block; font:700 11px/1 'Barlow Condensed', sans-serif; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.7); }
  .pill i { display:block; font:normal 26px/1.05 Anton, Impact, sans-serif; margin-top:4px; }
  .pill.hot { background:#fff; border-color:#fff; color:var(--primary); }
  .pill.hot b { color:var(--primary); opacity:.7; }
  .chic { position:relative; margin:var(--gut) var(--gut) 0; border-radius:18px; overflow:hidden; }
  .label { font:700 12px/1 'Barlow Condensed', sans-serif; letter-spacing:.22em; text-transform:uppercase; }
  .big { font:40px/.95 Anton, Impact, sans-serif; text-transform:uppercase; }
  .jersey { min-height:170px; display:flex; align-items:center; }
  .jersey.has { min-height:250px; }
  .jersey.dark { background:radial-gradient(120% 90% at 75% 45%, #ffffff 0%, #e4e8e9 45%, #b8c0c2 100%); color:var(--primary); }
  .jersey.light { background:radial-gradient(110% 90% at 72% 45%, var(--primary) 0%, var(--deep) 80%); color:#fff; }
  .jersey .txt { position:relative; z-index:2; padding:18px 0 18px 22px; width:100%; }
  .jersey.has .txt { width:54%; padding-right:6px; }
  .jersey .txt .label { opacity:.7; }
  .jersey .txt .big { margin-top:8px; font-size:40px; overflow-wrap:anywhere; }
  .jersey .tag { display:inline-block; margin-top:12px; font:800 17px/1 'Barlow Condensed', sans-serif; letter-spacing:.14em; text-transform:uppercase; padding:7px 11px; border-radius:8px; }
  .jersey.dark .tag { background:var(--primary); color:#fff; }
  .jersey.light .tag { background:#fff; color:var(--primary); }
  .jersey img { position:absolute; z-index:1; right:8px; top:50%; transform:translateY(-50%); width:44%; height:88%; object-fit:contain; }
  .jersey .shirt { position:absolute; z-index:1; right:8px; top:50%; transform:translateY(-50%) rotate(4deg); width:44%; height:auto; max-height:88%; filter:drop-shadow(0 12px 14px rgba(0,0,0,.3)); }
  .field { background:#11161a; }
  .field .hd { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding:16px 18px 12px; }
  .field .hd .label { color:rgba(255,255,255,.6); }
  .field .hd .big { margin-top:6px; color:#ff2a2a; }
  .field .addr { text-align:right; font:600 12px/1.35 Inter, sans-serif; color:rgba(255,255,255,.65); white-space:pre-line; }
  .field img.own { display:block; width:100%; }
  .fmap { position:relative; height:250px; background:#3c5a33; overflow:hidden; }
  .fmap div { position:absolute; }
  .fmap .g2 { left:0; top:0; width:58%; height:52%; background:#47693a; }
  .fmap .road { left:0; right:0; bottom:0; height:34px; background:#55595c; }
  .fmap .dash { left:0; right:0; bottom:16px; height:2px; background:linear-gradient(90deg, #d8d29a 0 60%, transparent 60%); background-size:26px 2px; }
  .fmap .lot { left:8%; bottom:44px; width:50%; height:74px; background:#73777a; border-radius:3px; }
  .fmap .bays { left:9%; bottom:82px; width:48%; height:32px; background:linear-gradient(90deg, rgba(255,255,255,.55) 0 2px, transparent 2px); background-size:15px 32px; }

function shirtSVG(g) {
  if (!g || !SHAPES[g.shape]) return '';
  const n = parseInt(g.color.slice(1), 16), lum = .299 * (n >> 16) + .587 * ((n >> 8) & 255) + .114 * (n & 255);
  const ink = lum > 140 ? '#111' : '#fff';

}

/* team colors pulled from the jersey photo: the pickers stay as an override, not a chore */
function paletteFrom(dataUrl) {
  const im = new Image();
  im.onload = () => {
    const n = 64, c = document.createElement('canvas'); c.width = c.height = n;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0, n, n);
    const px = x.getImageData(0, 0, n, n).data, at = i => [px[i], px[i + 1], px[i + 2], px[i + 3]];
    // whatever sits in the four corners is backdrop, not jersey
    const bg = [0, (n - 1) * 4, n * (n - 1) * 4, (n * n - 1) * 4].map(at).reduce((a, p) => a.map((v, k) => v + p[k] / 4), [0, 0, 0, 0]);
    const bins = {};
    for (let i = 0; i < px.length; i += 4) {
      const [r, g, b, a] = at(i);
      if (a < 128) continue;
      if (bg[3] > 128 && Math.abs(r - bg[0]) + Math.abs(g - bg[1]) + Math.abs(b - bg[2]) < 70) continue;
      const k = (r >> 4) << 8 | (g >> 4) << 4 | (b >> 4), o = bins[k] || (bins[k] = { n: 0, r: 0, g: 0, b: 0 });
      o.n++; o.r += r; o.g += g; o.b += b;
    }
    const cols = Object.values(bins).map(o => ({ n: o.n, r: o.r / o.n, g: o.g / o.n, b: o.b / o.n })).sort((a, b) => b.n - a.n).slice(0, 14);
    if (!cols.length) return;
    const sat = q => { const mx = Math.max(q.r, q.g, q.b), mn = Math.min(q.r, q.g, q.b); return mx ? (mx - mn) / mx : 0; };
    const lum = q => .299 * q.r + .587 * q.g + .114 * q.b;
    const dist = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.g - b.g) + Math.abs(a.b - b.b);
    const hex = q => '#' + [q.r, q.g, q.b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
    const mul = (q, f) => ({ r: q.r * f, g: q.g * f, b: q.b * f });
    // primary: common, colorful, and dark enough to carry white type (darkened if it is not)
    // a white away jersey is mostly white: the team color is whatever colorful trim it has
    const vivid = cols.filter(q => sat(q) > .25);
    let primary = [...(vivid.length ? vivid : cols)].sort((a, b) => b.n * (.35 + sat(b)) - a.n * (.35 + sat(a)))[0];
    if (lum(primary) > 120) primary = mul(primary, 120 / lum(primary));
    const accent = cols.filter(q => dist(q, primary) > 130 && lum(q) > 110).sort((a, b) => b.n * (.3 + sat(b)) - a.n * (.3 + sat(a)))[0] || { r: 200, g: 205, b: 208 };
    // snap both to a named colorway: lighting wrecks the exact pixel values but keeps the hue,
    // so we name what we see and then use clean canonical colors instead of the photo's
    const P = snap(primary, true), A = snap(accent, false);
    S.colors = { primary: P.hex, deep: P.deep, accent: A.hex };
    S.colorway = `${P.name} / ${A.name}`;
    render();
  };
  im.src = dataUrl;
}
// hue bins for team colors; a dark version of a hue gets its own name where teams actually use it
const HUES = [
  { name: 'Red', h: 0, hex: '#c8102e', dark: { name: 'Maroon', hex: '#6b1220' } },
  { name: 'Orange', h: 25, hex: '#e8641b' },
  { name: 'Gold', h: 45, hex: '#e0b23c' },
  { name: 'Green', h: 120, hex: '#1f8a3b', dark: { name: 'Forest green', hex: '#1c4d2b' } },
  { name: 'Teal', h: 185, hex: '#0d6b73' },
  { name: 'Blue', h: 218, hex: '#1f5fbf', dark: { name: 'Navy', hex: '#0b2a5b' } },
  { name: 'Purple', h: 265, hex: '#4b2a8a' },
  { name: 'Pink', h: 330, hex: '#d63384' },
];
function snap(q, forPrimary) {
  const r = q.r / 255, g = q.g / 255, b = q.b / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  const l = (mx + mn) / 2, s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  let h = 0; if (d) { h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360; }
  let out;
  if (s < .18) out = l < .25 ? { name: 'Black', hex: '#111111' } : l > .72 ? { name: 'White', hex: '#f4f4f4' } : { name: 'Silver', hex: '#a5acaf' };
  else {
    const bin = HUES.map(x => ({ x, dd: Math.min(Math.abs(x.h - h), 360 - Math.abs(x.h - h)) })).sort((a, b) => a.dd - b.dd)[0].x;
    out = bin.dark && l < .28 ? bin.dark : { name: bin.name, hex: bin.hex };
  }
  // a primary must carry white type; a white or gold "primary" means the photo was mostly trim
  if (forPrimary && (out.name === 'White' || out.name === 'Silver' || out.name === 'Gold')) out = { name: 'Black', hex: '#1b1b1b' };
  const n = parseInt(out.hex.slice(1), 16), dk = v => Math.round(v * .38).toString(16).padStart(2, '0');
  return { ...out, deep: '#' + dk(n >> 16) + dk((n >> 8) & 255) + dk(n & 255) };
}

/* ---------------- copy ---------------- */
function overlay(html) { $('#overlay').innerHTML = `<div class="ov"><div class="box">${html}<div style="margin-top:12px"><button class="btn" data-act="closeOv">Done</button></div></div></div>`; }

// one copy: the clipboard gets the whole email as HTML (picture + buttons), the picture alone, and plain text.
// A mail app takes the richest form it supports. The promises go straight into ClipboardItem so Safari still counts this as the tap.
function copyPicture() {
  const shot = $('#shot'); shot.innerHTML = mailHTML({ flat: true });
  const canvasP = html2canvas(shot.firstElementChild, { scale: 2, backgroundColor: null, logging: false });
  const pngP = canvasP.then(c => new Promise(res => c.toBlob(res, 'image/png')));
  const htmlP = canvasP.then(c => new Blob([`<div style="width:420px;max-width:100%"><img src="${c.toDataURL('image/png')}" width="420" style="display:block;width:420px;max-width:100%;height:auto" alt="Game day info">${footerHTML(true)}</div>`], { type: 'text/html' }));
  const txtP = Promise.resolve(new Blob([textBlock()], { type: 'text/plain' }));
  let copied = Promise.resolve(false);
  try { copied = navigator.clipboard.write([new ClipboardItem({ 'text/html': htmlP, 'image/png': pngP, 'text/plain': txtP })]).then(() => true, () => false); } catch (e) {}
  overlay('<p class="eyebrow">Building the email…</p>');
  Promise.all([canvasP, copied]).then(([c, ok]) => {
    shot.innerHTML = '';
    if (S.season[S.cur]) { S.season[S.cur].sent = true; const list = $('.wk-list'); if (list) list.outerHTML = wkList(); const st = $('.status'); if (st) { st.textContent = 'Sent'; st.classList.add('sent'); } }
    overlay(`<p class="eyebrow">${ok ? 'Email copied' : 'Email ready'}</p><p style="margin:0">${ok ? 'Paste it into your message and send.' : 'This browser would not copy it directly. Press and hold the picture (or right-click it) and choose Copy, then paste it into your message.'}</p>
      <p class="hint" style="margin-top:6px">Prototype: the picture is drawn in your browser and the buttons ride along as HTML. Whether your mail app keeps the buttons on paste is the thing to check on a real phone.</p><img src="${c.toDataURL('image/png')}" alt="The finished email as one picture">`);
  }).catch(() => overlay('<p class="eyebrow">Could not build the email here</p><p style="margin:0">The real app builds it on the server, so this step does not depend on your browser.</p>'));
}
function copyText() {
  const txt = textBlock();
  const done = ok => overlay(`<p class="eyebrow">${ok ? 'Text copied' : 'Select and copy'}</p><p style="margin:0">Paste it under the picture and send. Your mail app turns the links and phone numbers into taps.</p><textarea id="txtOut" readonly>${esc(txt)}</textarea>`);
  try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (e) { done(false); }
}

/* ---------------- team link: the whole team-season rides in the link itself; no server, no login ---------------- */
const rid = () => Math.random().toString(36).slice(2, 10);
const b64u = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const pipe = (bytes, x) => new Response(new Blob([bytes]).stream().pipeThrough(x));
async function squeeze(obj) { return b64u(new Uint8Array(await pipe(JSON.stringify(obj), new CompressionStream('deflate-raw')).arrayBuffer())); }
async function unsqueeze(str) { return JSON.parse(await pipe(unb64u(str), new DecompressionStream('deflate-raw')).text()); }
async function teamLink() {
  S.id = S.id || rid(); saveApp();
  // pictures are too big to ride in a link; they stay on the device that added them
  const t = JSON.parse(JSON.stringify(S)); t.data.wear.photo = ''; t.data.map.own = ''; t.data.map.img = ''; t.data.map.raw = '';
  const url = `${location.origin}${location.pathname}#t=${await squeeze(t)}`;
  overlay(`<p class="eyebrow">Team link · ${esc(S.data.event.team)}</p><p style="margin:0">Open this link on any phone or computer and the team is there, schedule and all. Anyone you send it to gets a copy, so share it with co-coaches only.</p>
    <textarea readonly id="linkOut" style="min-height:96px;font-size:11.5px;word-break:break-all">${esc(url)}</textarea>
    <div class="send" style="margin-top:10px"><div class="btns"><button class="btn" data-act="copyLink">Copy link</button><a class="btn alt" href="sms:?&body=${encodeURIComponent(url)}" style="text-align:center;text-decoration:none">Text it to me</a></div></div>
    <p class="hint" style="margin-top:10px">The link is a snapshot of the team right now. Change something later and you'd grab a fresh link. Pictures stay on this device.</p>`);
}
// colors ride into style="" and pictures into src="" unescaped, so a link only gets to set well-formed ones
function scrubImport(t) {
  const hex = v => (typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v)) ? v : null;
  const ex = preset(['flag', 'basketball', 'soccer', 'wrestling'].includes(t.sport) ? t.sport : 'flag');
  t.colors = t.colors || {};
  for (const k of ['primary', 'deep', 'accent']) t.colors[k] = hex(t.colors[k]) || ex.colors[k];
  if (!t.data.wear) t.data.wear = ex.data.wear;
  t.data.wear.photo = ''; if (!t.data.map) t.data.map = ex.data.map; t.data.map.own = ''; t.data.map.img = ''; t.data.map.raw = '';
  if (Array.isArray(t.data.map.boxes)) t.data.map.boxes = t.data.map.boxes.filter(b => b && [b.x0, b.y0, b.x1, b.y1].every(n => typeof n === 'number' && isFinite(n))).map(b => ({ x0: b.x0, y0: b.y0, x1: b.x1, y1: b.y1, label: String(b.label || '').slice(0, 40) }));
  if (t.data.map.pin && typeof t.data.map.pin === 'object' && !(typeof t.data.map.pin.mx === 'number' && isFinite(t.data.map.pin.mx))) { delete t.data.map.pin.mx; delete t.data.map.pin.my; }
  if (t.data.map.center && !(typeof t.data.map.center.lat === 'number' && typeof t.data.map.center.lon === 'number')) delete t.data.map.center;
  if (t.data.wear.generic) t.data.wear.generic.color = hex(t.data.wear.generic.color) || t.colors.primary;
  if (typeof t.id !== 'string' || !/^[a-z0-9]{1,16}$/.test(t.id)) delete t.id;
  normalizeTeam(t);
  if (t.data.link && !/^https?:\/\//i.test(String(t.data.link.url || ''))) t.data.link.url = '';
}
async function importFromLink() {
  const m = location.hash.match(/^#t=([\w-]+)$/); if (!m) return;
  history.replaceState(null, '', location.pathname);
  let t; try { t = await unsqueeze(m[1]); if (!t || !t.data || !Array.isArray(t.season)) throw 0; scrubImport(t); }
  catch (e) { overlay('<p class="eyebrow">That link is damaged</p><p style="margin:0">Part of it may have been cut off when it was sent. Ask for it again.</p>'); return; }
  const before = JSON.stringify(APP.teams), tiBefore = APP.ti;
  try {
  const i = APP.teams.findIndex(x => x.id && x.id === t.id);
  if (i >= 0) {
    const old = APP.teams[i];
    t.data.wear.photo = old.data.wear.photo || ''; t.data.map.own = old.data.map.own || ''; t.data.map.img = old.data.map.img || ''; t.data.map.raw = old.data.map.raw || '';
    if (JSON.stringify(old) !== JSON.stringify(t) && !confirm(`Replace ${old.data.event.team} on this device with the copy in the link?`)) return;
    APP.teams[i] = t; APP.ti = i;
  } else {
    if (freshDevice) APP.teams = [];                // a fresh device: the linked team, not the examples
    freshDevice = false;
    APP.teams.push(t); APP.ti = APP.teams.length - 1;
  }
  S = t; applyEvent(t.cur); go('season');
  } catch (e) {
    APP.teams = JSON.parse(before); APP.ti = tiBefore; S = APP.teams[APP.ti] || APP.teams[0]; saveApp();
    overlay('<p class="eyebrow">That link is damaged</p><p style="margin:0">The team in it could not be opened. Nothing on this device was changed.</p>');
  }
}
window.addEventListener('hashchange', importFromLink);
matchMedia('(min-width: 900px)').addEventListener('change', () => { if (APP.page === 'setup') render(); });

/* ---------------- boot ---------------- */
render();
importFromLink();
